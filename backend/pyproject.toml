[project]
name = "rambu-digital-prototype"
version = "0.1.0"
description = "Digital call-simulation, transcription, and Langflow analysis prototype for Rambu"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "faster-whisper>=1.1,<2",
    "httpx[http2]>=0.28,<1",
    "PyJWT[crypto]>=2.9,<3",
    "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_langflow: calls the configured live Langflow and model provider",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rambu_api"]
