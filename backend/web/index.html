<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Simulasi transkripsi dan deteksi indikasi penipuan saat panggilan." />
    <title>Rambu — Simulasi Panggilan</title>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/app.js" defer></script>
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-content">
        <a class="brand" href="/">Rambu</a>
        <span class="prototype-tag">Prototipe digital</span>
      </div>
    </header>

    <main>
      <section class="page-heading">
        <h1>Simulasi deteksi risiko panggilan</h1>
      </section>

      <section class="controls-panel" aria-labelledby="controls-title">
        <h2 id="controls-title">Mulai simulasi</h2>
        <div class="control-row">
          <label for="scenario-select">Skenario</label>
          <select id="scenario-select">
            <option value="bank-otp" data-audio="/samples/bank-otp.wav">Mengaku petugas bank — risiko tinggi</option>
            <option value="kecelakaan-transfer" data-audio="/samples/kecelakaan-transfer.wav">Kabar kecelakaan — risiko tinggi</option>
            <option value="kurir-aplikasi" data-audio="/samples/kurir-aplikasi.wav">Kurir meminta aplikasi — risiko tinggi</option>
            <option value="tetangga-aman" data-audio="/samples/tetangga-aman.wav">Telepon tetangga — risiko rendah</option>
          </select>
          <button id="start-button" class="primary-button" type="button">Mulai</button>
          <button id="reset-button" class="secondary-button" type="button" disabled>Atur ulang</button>
        </div>
        <audio id="call-audio" controls preload="metadata" src="/samples/bank-otp.wav">
          Peramban Anda tidak mendukung pemutar audio.
        </audio>
      </section>

      <section class="results-panel" aria-labelledby="results-title">
        <div class="results-header">
          <h2 id="results-title">Hasil</h2>
          <span id="processing-status" class="status" data-state="idle">Siap</span>
        </div>

        <div class="progress-row">
          <div class="progress-track" aria-label="Progres pemrosesan">
            <div id="progress-bar" class="progress-bar" style="width: 0%"></div>
          </div>
          <span id="progress-value">0%</span>
        </div>

        <p id="error-message" class="error-message" hidden role="alert"></p>

        <div class="results-grid">
          <article class="transcript-section" aria-labelledby="transcript-title">
            <h3 id="transcript-title">Transkrip</h3>
            <div id="transcript-empty" class="empty-state">Belum ada transkrip.</div>
            <p id="transcript-text" class="transcript-text" hidden aria-live="polite"></p>
          </article>

          <aside class="assessment-section" aria-labelledby="assessment-title">
            <h3 id="assessment-title">Peringatan</h3>

            <div id="assessment-empty" class="assessment-empty">
              <strong>Belum ada hasil.</strong>
            </div>

            <div id="risk-banner" class="assessment-content" data-risk="pending" hidden>
              <div class="risk-heading">
                <span class="risk-dot" aria-hidden="true"></span>
                <strong id="risk-value">Menunggu analisis</strong>
              </div>
              <p id="explanation-text" class="risk-explanation"></p>

              <div class="evidence-block">
                <p class="plain-label">Yang terdengar mencurigakan</p>
                <ul id="indicator-list"></ul>
              </div>

              <div class="recommendation-block">
                <p class="plain-label">Yang sebaiknya dilakukan</p>
                <p id="action-text"></p>
              </div>
            </div>
          </aside>
        </div>
      </section>
    </main>
  </body>
</html>
